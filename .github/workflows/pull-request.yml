name: Pull request validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_engineer_os
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: ai_engineer_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_engineer_os -d ai_engineer_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ai_engineer_os:local_dev_password@localhost:5432/ai_engineer_os_test
      CURRICULUM_LOCAL_PATH: ./upstream/ai-engineering-from-scratch
      CURRICULUM_PINNED_SHA: c81651a83aff5f7bf307ffe4392f0d97f3b27ad6
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned curriculum
        uses: actions/checkout@v4
        with:
          repository: rohitg00/ai-engineering-from-scratch
          ref: c81651a83aff5f7bf307ffe4392f0d97f3b27ad6
          path: upstream/ai-engineering-from-scratch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Initialize isolated test database
        run: |
          npm run db:migrate
          npm run curriculum:import
      - run: npm run validate
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
