services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_engineer_os
      POSTGRES_USER: ai_engineer_os
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ai_engineer_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_engineer_os -d ai_engineer_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_engineer_os_pgdata:
